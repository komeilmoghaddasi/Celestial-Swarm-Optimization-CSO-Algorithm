# Celestial Swarm Optimization (CSO) hyperparameters
CSO:
  population_size: 50
  max_iterations: 100
  stagnation_threshold: 10
  gravitational_coefficient: 0.4  # Attraction to best solution
  center_of_mass_coefficient: 0.4  # Attraction to center of mass
  noise_coefficient: 0.1  # Random noise for exploration
  min_bound: 0
  max_bound: 1
  clipping_enabled: true
