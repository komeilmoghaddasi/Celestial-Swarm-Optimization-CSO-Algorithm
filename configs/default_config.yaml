# General simulation settings
simulation:
  num_devices: 100   # Number of IoT devices
  tasks_per_device: 5  # Number of tasks per IoT device
  task_size_range: [500, 5000]  # Task size in KB (min, max)
  random_seed: 42   # Seed for reproducibility

# CPU and memory parameters
hardware:
  local_cpu_freq: 1.2  # GHz
  edge_cpu_freq: 2.5  # GHz
  local_energy_cost: 2.5  # Energy per KB (Joules)
  edge_energy_cost: 1.0  # Energy per KB (Joules)
  memory_local_scaling: 0.0005  # Scaling factor for memory (local)
  memory_edge_scaling: 0.0002  # Scaling factor for memory (edge)

# Algorithm selection
algorithms:
  methods: ["Random", "PSO", "GWO", "GA", "SA", "CSO"]
  num_runs: 30  # Number of independent runs per algorithm

# Output settings
output:
  save_results: true
  save_plots: true
  results_dir: "../results/"
